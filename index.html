<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Placement Test | Black White School</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #131314;
            --card-bg: #1e1f20;
            --text-main: #e3e3e3;
            --text-secondary: #c4c7c5;
            --accent: #a8c7fa;
            --error: #f2b8b5;
            --success: #c4eed0;
            --border: #444746;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Open Sans', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        h1, h2, h3, .stat-value { font-family: 'Google Sans', sans-serif; }

        .header { width: 100%; padding: 25px 8%; display: flex; justify-content: space-between; align-items: center; background: rgba(19, 19, 20, 0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
        .brand-container { display: flex; flex-direction: column; }
        .school-name { font-size: 1.5rem; font-weight: 700; color: #fff; line-height: 1.1; }
        .school-slogan { font-size: 0.85rem; color: var(--text-secondary); font-weight: 400; margin-top: 4px; }
        .logo-box img { height: 55px; width: auto; }

        .container { width: 100%; max-width: 900px; padding: 20px; margin-top: 20px; }
        .card { background-color: var(--card-bg); border-radius: 28px; padding: 40px; margin-bottom: 24px; border: 1px solid var(--border); }
        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.5s ease; }

        .question-text { font-size: 1.15rem; margin-bottom: 20px; color: var(--text-main); line-height: 1.5; }
        .opt-label { display: flex; align-items: center; padding: 18px; margin-bottom: 12px; background: #2b2c2f; border: 1px solid var(--border); border-radius: 18px; cursor: pointer; transition: 0.2s; }
        .opt-label:hover { background: #37393b; border-color: var(--accent); }
        input[type="radio"] { margin-right: 15px; transform: scale(1.3); accent-color: var(--accent); }

        .btn { background-color: var(--accent); color: #062e6f; padding: 16px 32px; border-radius: 100px; border: none; font-weight: 600; cursor: pointer; font-size: 1rem; transition: 0.3s; }
        .btn:hover { opacity: 0.9; box-shadow: 0 4px 12px rgba(168, 199, 250, 0.3); }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin: 30px 0; }
        .stat-box { background: #2b2c2f; padding: 24px; border-radius: 24px; border: 1px solid var(--border); }
        .stat-label { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 10px; }
        .stat-value { font-size: 2.2rem; font-weight: 700; color: var(--text-main); }
        .mini-stats { display: flex; flex-direction: column; gap: 10px; }
        .mini-item { display: flex; justify-content: space-between; color: var(--text-secondary); font-size: 0.95rem; }

        .review-item { background: #2b2c2f; border-radius: 20px; padding: 24px; margin-bottom: 16px; border: 1px solid var(--border); }
        .review-correct { border-left: 6px solid #4caf50; }
        .review-incorrect { border-left: 6px solid #f44336; }
        .explanation { margin-top: 15px; padding: 14px; background: rgba(168, 199, 250, 0.08); border-radius: 14px; font-size: 0.9rem; color: var(--accent); line-height: 1.4; }

        input.field { width: 100%; background: #2b2c2f; border: 1px solid var(--border); padding: 18px; border-radius: 18px; color: #fff; margin-bottom: 20px; font-size: 1rem; }
        
        .btn-group-wa { display: flex; flex-direction: column; gap: 15px; margin-bottom: 40px; }
        .btn-wa { background-color: #25D366; color: #fff; text-decoration: none; padding: 16px; border-radius: 100px; font-weight: 600; text-align: center; border: none; cursor: pointer; font-size: 1rem; transition: 0.3s; font-family: 'Open Sans', sans-serif; }
        .btn-wa:hover { opacity: 0.85; transform: translateY(-2px); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="header">
    <div class="brand-container">
        <div class="school-name">Black White School</div>
        <div class="school-slogan">Ajudando você a entender o mundo</div>
    </div>
    <div class="logo-box"><img src="logos.png" alt="Logo"></div>
</div>

<div class="container">
    <div class="card">
        <div class="step active" id="step-0">
            <h2 style="margin-bottom:12px">Teste de Nivelamento IELTS</h2>
            <p style="color:var(--text-secondary); margin-bottom:30px">Avalie seu inglês com questões autorais de nivelamento e feedback instantâneo.</p>
            <input type="text" id="stuName" class="field" placeholder="Nome Completo">
            <input type="tel" id="stuPhone" class="field" placeholder="WhatsApp">
            <button class="btn" onclick="startTest()">Começar Teste</button>
        </div>
        <div id="quiz-content"></div>
        <div class="step" id="step-result">
            <h2>Resultado da Avaliação</h2>
            <div class="stats-grid">
                <div class="stat-box"><div class="stat-label">Band Score</div><div class="stat-value" id="res-band">0.0</div></div>
                <div class="stat-box"><div class="stat-label">Precisão</div><div class="stat-value" id="res-accuracy">0%</div></div>
                <div class="stat-box">
                    <div class="mini-stats">
                        <div class="mini-item"><span>Acertos</span> <strong id="res-right" style="color:var(--success)">0</strong></div>
                        <div class="mini-item"><span>Erros</span> <strong id="res-wrong" style="color:var(--error)">0</strong></div>
                    </div>
                </div>
            </div>

            <div class="btn-group-wa">
                <button class="btn-wa" onclick="sendToWhatsApp('5519991717549')">Enviar Resultado para Unidade Jd. Eldorado</button>
                <button class="btn-wa" onclick="sendToWhatsApp('5519982183404')" style="background-color: #128C7E;">Enviar Resultado para Unidade Pq. Ecológico</button>
            </div>

            <h3 style="margin-bottom:20px">Revisão e Feedback</h3>
            <div id="review-area"></div>
        </div>
    </div>
</div>

<script>
    const questions = [
        {"q": "My brother ______ twelve years old.", "a": ["am", "is", "are", "be"], "c": 1, "f": "Usamos 'is' com sujeito na terceira pessoa do singular no presente."},
        {"q": "There are three ______ on the bus.", "a": ["childs", "childrens", "children", "childes"], "c": 2, "f": "O plural irregular de 'child' é 'children'."},
        {"q": "We ______ English on Mondays.", "a": ["studies", "studying", "study", "studied"], "c": 2, "f": "Com 'we', o presente simples afirmativo usa a forma base 'study'."},
        {"q": "Choose the correct question to ask someone's name.", "a": ["What your name is?", "What is your name?", "What name you are?", "What does your name?"], "c": 1, "f": "Em perguntas com 'be', o verbo vem antes do sujeito: 'What is your name?'."},
        {"q": "I can see two ______ in the garden.", "a": ["box", "boxs", "boxes", "boxies"], "c": 2, "f": "Substantivos terminados em 'x' normalmente recebem '-es' no plural."},
        {"q": "My parents ______ at home right now.", "a": ["is", "am", "are", "be"], "c": 2, "f": "'My parents' é um sujeito plural, portanto usamos 'are'."},
        {"q": "She ______ coffee every morning.", "a": ["drink", "drinks", "drinking", "drank"], "c": 1, "f": "No presente simples, acrescentamos '-s' com 'she'."},
        {"q": "Yesterday was Friday. Today is ______.", "a": ["Thursday", "Sunday", "Saturday", "Monday"], "c": 2, "f": "O dia seguinte a Friday (sexta-feira) é Saturday (sábado)."},
        {"q": "There ______ a book on the table.", "a": ["are", "have", "is", "be"], "c": 2, "f": "Na estrutura 'there is/are', usamos 'is' com um substantivo singular."},
        {"q": "Choose the correct negative sentence.", "a": ["He don't like milk.", "He doesn't likes milk.", "He doesn't like milk.", "He not like milk."], "c": 2, "f": "Após 'doesn't', usamos a forma base do verbo: 'like'."},
        {"q": "We ______ to the museum last Sunday.", "a": ["go", "went", "gone", "going"], "c": 1, "f": "'Last Sunday' indica passado concluído; o passado de 'go' é 'went'."},
        {"q": "Look through the window! The children ______ in the garden right now.", "a": ["played", "are playing", "plays", "have played"], "c": 1, "f": "A expressão 'right now' indica uma ação em andamento no momento da fala. Usamos o present continuous: are + verbo com -ing."},
        {"q": "The blue suitcase is ______ than the red one.", "a": ["heavy", "heaviest", "more heavy", "heavier"], "c": 3, "f": "O comparativo regular de 'heavy' é 'heavier'."},
        {"q": "I have lived in this city ______ 2021.", "a": ["for", "since", "during", "ago"], "c": 1, "f": "'Since' introduz o ponto inicial de uma situação que continua."},
        {"q": "You ______ wear a seat belt while driving. It's required by law.", "a": ["must", "might", "would", "could"], "c": 0, "f": "'Must' expressa obrigação; aqui a obrigatoriedade é explicitada pela lei."},
        {"q": "I was cooking dinner when the lights ______ out.", "a": ["go", "gone", "went", "going"], "c": 2, "f": "A interrupção pontual no passado pede 'went out'."},
        {"q": "This is the ______ film I have ever seen.", "a": ["good", "better", "best", "well"], "c": 2, "f": "Com 'the' e uma comparação de toda a experiência, usamos o superlativo 'best'."},
        {"q": "Could you tell me where the nearest bank ______?", "a": ["is", "does", "be", "are"], "c": 0, "f": "Em perguntas indiretas, a ordem é sujeito + verbo: 'where the nearest bank is'."},
        {"q": "If it ______ tomorrow, we'll stay indoors.", "a": ["will snow", "snowed", "snows", "snowing"], "c": 2, "f": "No first conditional, a oração com 'if' usa present simple."},
        {"q": "I haven't finished my homework ______.", "a": ["already", "yet", "still", "ever"], "c": 1, "f": "Em uma negativa no present perfect, 'yet' indica que algo não aconteceu até agora."},
        {"q": "The report ______ by the finance team yesterday.", "a": ["was prepared", "prepared", "has preparing", "was prepare"], "c": 0, "f": "Voz passiva no passado simples: 'was/were + past participle'."},
        {"q": "The woman ______ car was stolen called the police.", "a": ["who", "which", "whose", "whom"], "c": 2, "f": "'Whose' estabelece a relação de posse entre a mulher e o carro."},
        {"q": "By the time we reached the station, the train ______.", "a": ["has left", "had left", "leaves", "is leaving"], "c": 1, "f": "O past perfect mostra que a partida ocorreu antes de chegarmos à estação."},
        {"q": "If I ______ more free time, I would learn Italian.", "a": ["have", "will have", "had", "having"], "c": 2, "f": "No second conditional, usamos past simple na oração com 'if'."},
        {"q": "I'm used to ______ early because my shift starts at six.", "a": ["wake up", "waking up", "woke up", "have woken up"], "c": 1, "f": "'Be used to' é seguido de substantivo ou verbo em '-ing'."},
        {"q": "She apologized ______ arriving late.", "a": ["to", "for", "of", "with"], "c": 1, "f": "A combinação correta é 'apologize for + -ing'."},
        {"q": "The teacher asked us ______ our phones during the exam.", "a": ["not use", "don't use", "not to use", "to not using"], "c": 2, "f": "A estrutura é 'ask someone not to do something'."},
        {"q": "The new policy will come ______ effect on January 1.", "a": ["into", "on", "at", "by"], "c": 0, "f": "A colocação fixa é 'come into effect' (entrar em vigor)."},
        {"q": "Despite ______ tired, Marta completed the assignment.", "a": ["be", "being", "was", "she was"], "c": 1, "f": "Após 'despite', podemos usar substantivo ou uma forma em '-ing'."},
        {"q": "He denied ______ the confidential document.", "a": ["to share", "share", "sharing", "shared"], "c": 2, "f": "Em construções como esta, 'deny' é seguido de verbo em '-ing'."},
        {"q": "Not until the results were published ______ the error.", "a": ["the researchers noticed", "did the researchers notice", "the researchers did notice", "had the researchers noticing"], "c": 1, "f": "Depois de 'Not until' no início da oração, há inversão entre auxiliar e sujeito."},
        {"q": "Had the committee been informed earlier, it ______ a different decision.", "a": ["would make", "will have made", "would have made", "had made"], "c": 2, "f": "A oração invertida corresponde a um third conditional: 'would have + particípio'."},
        {"q": "The proposal was rejected on the grounds that it was not financially ______.", "a": ["viable", "visible", "vivid", "vitality"], "c": 0, "f": "'Financially viable' significa financeiramente exequível; as outras opções não expressam isso."},
        {"q": "Scarcely had the meeting begun ______ the fire alarm sounded.", "a": ["than", "when", "that", "while"], "c": 1, "f": "A construção formal é 'scarcely ... when'."},
        {"q": "It is essential that every applicant ______ the form before the deadline.", "a": ["submits to", "submitting", "submit", "to submit"], "c": 2, "f": "No inglês formal, 'it is essential that' pode exigir o subjuntivo com verbo na forma base."},
        {"q": "The findings are consistent ______ those of the earlier study.", "a": ["to", "with", "for", "by"], "c": 1, "f": "A colocação correta é 'consistent with'."},
        {"q": "No sooner had she opened the presentation ______ the projector stopped working.", "a": ["when", "that", "than", "as"], "c": 2, "f": "A construção correlativa é 'no sooner ... than'."},
        {"q": "The report is unlikely to be approved, ______ substantial revisions are made.", "a": ["unless", "despite", "whereas", "because of"], "c": 0, "f": "'Unless' introduz a condição necessária para contrariar a previsão negativa."},
        {"q": "Choose the sentence that correctly uses a reduced relative clause.", "a": ["The documents submitting yesterday are missing.", "The documents submitted yesterday are missing.", "The documents were submitted yesterday are missing.", "The documents which submitted yesterday are missing."], "c": 1, "f": "'Submitted yesterday' reduz a oração passiva 'which were submitted yesterday'."},
        {"q": "The evidence was too ______ to justify such a far-reaching conclusion.", "a": ["conclusive", "inconclusive", "conclude", "conclusion"], "c": 1, "f": "'Inconclusive' indica evidências insuficientes para sustentar uma conclusão definitiva."}
    ];

    let userAnswers = {};
    function startTest() {
        if(document.getElementById('stuName').value.length < 3) return alert("Digite seu nome.");
        if (!document.getElementById('step-1')) buildQuiz();
        showPage(1);
    }
    function showPage(p) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        const target = document.getElementById('step-' + p);
        if(target) target.classList.add('active');
        window.scrollTo(0,0);
    }
    function buildQuiz() {
        const container = document.getElementById('quiz-content');
        if (document.getElementById('step-1')) return;
        const qPerPage = 8;
        for(let p=0; p < 5; p++) {
            const div = document.createElement('div');
            div.className = 'step'; div.id = 'step-' + (p+1);
            let html = `<h2 style="margin-bottom:30px">Parte ${p+1} / 5</h2>`;
            for(let i=0; i < qPerPage; i++) {
                let idx = (p * qPerPage) + i;
                html += `<div class="question-item" style="margin-bottom:40px"><p class="question-text"><strong>${idx+1}.</strong> ${questions[idx].q}</p>`;
                questions[idx].a.forEach((opt, oI) => {
                    html += `<label class="opt-label"><input type="radio" name="q${idx}" onclick="userAnswers[${idx}]=${oI}"> ${opt}</label>`;
                });
                html += `</div>`;
            }
            let isLast = (p === 4);
            html += `<button class="btn" onclick="${isLast ? 'finalize()' : `showPage(${p+2})`}">${isLast ? 'Finalizar' : 'Próximo'}</button>`;
            div.innerHTML = html; container.appendChild(div);
        }
    }

    let finalBand = "0.0";
    let finalRight = 0;
    let finalAccuracy = "0%";

    function finalize() {
        let right = 0, wrong = 0;
        let reviewHtml = "";
        questions.forEach((q, i) => {
            let isC = (userAnswers[i] === q.c);
            if(isC) right++; else wrong++;
            reviewHtml += `<div class="review-item ${isC ? 'review-correct' : 'review-incorrect'}"><p><strong>${i+1}.</strong> ${q.q}</p><p style="font-size:0.9rem">Sua resposta: ${userAnswers[i] !== undefined ? q.a[userAnswers[i]] : "Em branco"}</p>${!isC ? `<p style="font-size:0.9rem; color:var(--accent)">Correta: ${q.a[q.c]}</p>` : ""}<div class="explanation"><strong>Dica:</strong> ${q.f}</div></div>`;
        });
        
        finalBand = ((right / 40) * 9).toFixed(1);
        finalRight = right;
        finalAccuracy = Math.round((right/40)*100) + "%";

        document.getElementById('res-band').innerText = finalBand;
        document.getElementById('res-accuracy').innerText = finalAccuracy;
        document.getElementById('res-right').innerText = right;
        document.getElementById('res-wrong').innerText = wrong;
        document.getElementById('review-area').innerHTML = reviewHtml;
        
        showPage('result');
    }

    function sendToWhatsApp(phone) {
        const name = document.getElementById('stuName').value;
        const msg = encodeURIComponent(`*IELTS RESULT - Black White School*\n*Nome:* ${name}\n*Score:* ${finalBand}\n*Acertos:* ${finalRight}/40\n*Precisão:* ${finalAccuracy}`);
        window.open(`https://wa.me/${phone}?text=${msg}`);
    }

    // Inicializa imediatamente porque o script fica depois do HTML.
    // Não depende do evento window.onload, que pode ser sobrescrito.
    buildQuiz();
</script>
</body>
</html>
